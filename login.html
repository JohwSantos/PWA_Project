<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Catraca</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
    <style>
        .login-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            padding: 32px 24px;
            max-width: 400px;
            margin: 40px auto;
        }
        .login-title {
            text-align: center;
            color: #2a9d8f;
            font-size: 1.5rem;
            margin-bottom: 24px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-title">Login do Usuário</div>
        <form id="formLogin">
            <label for="usuario">Usuário:</label>
            <input type="text" id="usuario" name="usuario" required autofocus>
            <br>
            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" required>
            <br>
            <button type="submit">Entrar</button>
        </form>
    </div>
    <script>
    document.getElementById('formLogin').addEventListener('submit', function(event) {
        event.preventDefault();
        const usuario = document.getElementById('usuario').value.trim();
        const senha = document.getElementById('senha').value;
        if (usuario === '26720' && senha === '26720') {
            alert('Login efetuado com sucesso!');
            // Aqui você pode redirecionar ou mostrar o nome do usuário
            document.querySelector('.login-title').textContent = 'Bem-vindo, Jonathan Santos!';
        } else {
            alert('Usuário ou senha incorretos.');
        }
    });
    </script>
</body>
</html>
