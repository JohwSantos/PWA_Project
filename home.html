<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Catraca - ETEC Zona Leste</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
    <style>
        .container-info {
            background: white;
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            padding: 32px 24px;
            max-width: 420px;
            margin: 40px auto;
            text-align: center;
        }
        .user-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            box-shadow: 0 4px 12px rgba(102,126,234,0.15);
            cursor: pointer;
            transition: box-shadow 0.2s;
        }
        .user-icon:hover {
            box-shadow: 0 8px 24px rgba(102,126,234,0.25);
        }
        .user-icon svg {
            width: 48px;
            height: 48px;
            fill: #fff;
        }
        .info-title {
            font-size: 1.5rem;
            color: #2a9d8f;
            margin-bottom: 12px;
        }
        .info-desc {
            color: #444;
            font-size: 1.1rem;
            margin-bottom: 24px;
        }
    </style>
</head>
<body>
    <div class="container-info">
        <div class="user-icon" onclick="window.location.href='login.html'" title="Fazer login">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v3h20v-3c0-3.3-6.7-5-10-5z"/></svg>
        </div>
        <div class="info-title">Sistema de Catraca</div>
        <div class="info-desc">
            Bem-vindo ao sistema de controle de acesso da <b>ETEC Zona Leste</b>.<br>
            Utilize o ícone de usuário acima para acessar o sistema.<br>
            O sistema garante segurança e praticidade no controle de entrada e saída dos alunos.
        </div>
    </div>
</body>
</html>
